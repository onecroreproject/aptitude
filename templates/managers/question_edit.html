{% extends 'base.html' %}

{% block header_title %}Edit Question{% endblock %}

{% block content %}
<div class="auth-wrapper" style="min-height: auto; padding: 2rem 0;">
    <div class="card" style="max-width: 800px; width: 100%; margin: 0 auto; opacity: 1;">
        <h3 class="mb-4" style="font-size: 1.125rem; font-weight: 700;">Update Question Details</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Select Course</label>
                <select name="course_id" class="form-control" required>
                    {% for course in courses %}
                    <option value="{{ course.id }}" {% if course.id == question.course.id %}selected{% endif %}>{{ course.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Question Text</label>
                <textarea name="text" class="form-control" rows="3" required>{{ question.text }}</textarea>
            </div>
            <div class="stats-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label class="form-label">Option 1</label>
                    <input type="text" name="opt1" class="form-control" value="{{ question.option1 }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Option 2</label>
                    <input type="text" name="opt2" class="form-control" value="{{ question.option2 }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Option 3</label>
                    <input type="text" name="opt3" class="form-control" value="{{ question.option3 }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Option 4</label>
                    <input type="text" name="opt4" class="form-control" value="{{ question.option4 }}" required>
                </div>
            </div>
            <div class="stats-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 0;">
                <div class="form-group">
                    <label class="form-label">Correct Option</label>
                    <select name="correct" class="form-control" required>
                        <option value="1" {% if question.correct_answer == 1 %}selected{% endif %}>Option 1</option>
                        <option value="2" {% if question.correct_answer == 2 %}selected{% endif %}>Option 2</option>
                        <option value="3" {% if question.correct_answer == 3 %}selected{% endif %}>Option 3</option>
                        <option value="4" {% if question.correct_answer == 4 %}selected{% endif %}>Option 4</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Question Marks</label>
                    <input type="number" name="marks" class="form-control" value="{{ question.marks }}" required>
                </div>
            </div>
            <div class="flex gap-2 mt-4">
                <a href="{% url 'view_course_questions' question.course.id %}" class="btn btn-outline" style="flex: 1;">Cancel</a>
                <button type="submit" class="btn btn-primary" style="flex: 2;">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
