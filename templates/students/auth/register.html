{% extends 'auth_base.html' %}

{% block title %}Register - AptiPro{% endblock %}

{% block content %}
<h2 class="mb-4" style="font-weight: 700;">Student Registration</h2>
<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label class="form-label">First Name</label>
        <input type="text" name="first_name" class="form-control" placeholder="John" required>
    </div>
    <div class="form-group">
        <label class="form-label">Last Name</label>
        <input type="text" name="last_name" class="form-control" placeholder="Doe" required>
    </div>
    <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="johndoe123" required>
    </div>
    <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
    </div>
    <div class="form-group">
        <label class="form-label">Mobile Number</label>
        <input type="text" name="mobile" class="form-control" placeholder="+91 1234567890" required>
    </div>
    <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Get Verification OTP</button>
</form>
<p class="mt-4 text-center" style="font-size: 0.875rem; color: var(--text-muted);">
    Already have an account? <a href="{% url 'login' %}" style="color: var(--primary); font-weight: 600;">Login</a>
</p>
{% endblock %}
