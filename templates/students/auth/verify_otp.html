{% extends 'auth_base.html' %}

{% block title %}Verify OTP - AptiPro{% endblock %}

{% block content %}
<h2 class="mb-2" style="font-weight: 700;">Account Verification</h2>
<p class="mb-4" style="color: var(--text-muted); font-size: 0.875rem;">We've sent a 6-digit code to {{ request.session.reg_data.email }}.</p>
<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label class="form-label">Verification Code (OTP)</label>
        <input type="text" name="otp" class="form-control" maxlength="6" placeholder="123456" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: 700;" required>
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Verify & Create Account</button>
</form>
<p class="mt-4 text-center" style="font-size: 0.875rem; color: var(--text-muted);">
    Didn't receive the email? <a href="#" onclick="location.reload()" style="color: var(--primary); font-weight: 600;">Resend OTP</a>
</p>
<p class="mt-2 text-center" style="font-size: 0.875rem; color: var(--text-muted);">
    Wrong email? <a href="{% url 'register' %}" style="color: var(--primary); font-weight: 600;">Register again</a>
</p>
{% endblock %}
