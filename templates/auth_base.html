<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aptitude Test Management{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block extra_css %}{% endblock %}
</head>
<body class="auth-wrapper">
    <div class="auth-card animate__animated animate__fadeIn">
        <div class="sidebar-logo justify-center mb-4">
            <i data-lucide="brain-circuit"></i>
            <span>AptiPro</span>
        </div>
        
        {% if messages %}
            <div class="messages mb-4">
                {% for message in messages %}
                    <div style="padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 0.5rem; border-left: 4px solid {% if message.tags == 'success' %}var(--success){% elif message.tags == 'error' %}var(--danger){% else %}var(--warning){% endif %}; background: {% if message.tags == 'success' %}var(--success-light){% elif message.tags == 'error' %}var(--danger-light){% else %}var(--warning-light){% endif %}; color: {% if message.tags == 'success' %}var(--success){% elif message.tags == 'error' %}var(--danger){% else %}var(--warning){% endif %}; font-size: 0.875rem;">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
